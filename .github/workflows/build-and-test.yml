name: Build and Test

on:
  push:
    branches: [ master, develop, release]
  pull_request:
    branches: [ master, develop, release]

jobs:
  unit_test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2016, ubuntu-18.04]
        include:
          - os: windows-2016
            pkg_cmnd: choco install -y packages.config
            cache_paths: |
                C:/ProgramData/chocolatey/lib/boost-*
                C:/local/boost_*
            build_unit_test: ./make.cmd /t
            experimental: false
            defaults:
              run:
                shell: cmd
                working-directory: ./ci-tools/windows

          - os: ubuntu-18.04
            pkg_cmnd: sudo xargs apt-get install -y < packages.txt
            build_unit_test: ./make.sh -t
            experimental: true
            defaults:
              run:
                shell: bash
                working-directory: ./ci-tools/linux

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        shell: ${{ matrix.defaults.run.shell }}
        working-directory: ${{ matrix.defaults.run.working-directory }}
    env:
      PROJECT: epanet
      BUILD_HOME: build

    steps:
    - name: Checkout epanet-solver repo
      uses: actions/checkout@v2

    - name: Checkout ci-tools repo
      uses: actions/checkout@v2
      with:
        repository: michaeltryby/ci-tools
        ref: master
        path: ci-tools

    - name: Cache boost
      if: runner.os != 'Linux'
      id: cache-boost
      uses: actions/cache@v2
      env:
        cache_paths: ${{ matrix.cache_paths }}
        cache_name: cache-boost
        pkg_file_hash: ${{ hashFiles('**/windows/packages.config') }}
      with:
        path: ${{ env.cache_paths }}
        key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ env.pkg_file_hash }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache_name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Install boost
      if: steps.cache-sys-deps.outputs.cache-hit != 'true'
      run: ${{ matrix.pkg_cmnd }}

    - name: Build and unit test
      run: ${{ matrix.build_unit_test }}



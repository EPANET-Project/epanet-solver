name: Build and Test

on:
  push:
    branches: [ master, develop, release]
  pull_request:
    branches: [ master, develop, release]

jobs:
  unit_test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2016, ubuntu-16.04]
        include:
          - os: windows-2016
            pkg_file: packages.config
            pkg_cmnd: choco install -y
            cache_paths: |
                C:/ProgramData/chocolatey/lib/boost-*
                C:/local/boost_*
            build_unit_test: make.cmd /t
            defaults:
              run:
                shell: cmd
                working-directory: ci-tools/windows

          - os: ubuntu-16.04
            pkg_file: packages.txt
            pkg_cmnd: sudo xargs apt-get install -y <
            cache_paths: |
                /var/cache/apt/pkgcache.bin
                /usr/lib/x86_64-linux-gnu/libboost_*
            build_unit_test: make.sh -t
            defaults:
              run:
                shell: bash
                working-directory: ci-tools/linux

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      PROJECT: epanet
      BUILD_HOME: build

    steps:
    - name: Checkout epanet-solver repo
      uses: actions/checkout@v2

    - name: Checkout ci-tools repo
      uses: actions/checkout@v2
      with:
        repository: michaeltryby/ci-tools
        ref: master
        path: ci-tools

    - name: Cache system deps
      uses: actions/cache@v2
      env:
        cache-name: cache-sys-deps
      with:
        path: ${{ matrix.cache-paths }}
        key: ${{ matrix.os }}-build-${{ env.cache-name }}-${{ hashFiles(${{ matrix.pkg_file }}) }}
        restore-keys: |
          windows-build-${{ env.cache-name }}-
          windows-build-
          windows-

    - name: Install system deps
      run: ${{ matrix.pkg_cmnd }} ${{ matrix.pkg_file }}

    - name: Build and unit test
      run: ${{ matrix.build_unit_test}}



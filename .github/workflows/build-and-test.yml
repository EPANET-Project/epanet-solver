name: Build and Test

on:
  push:
    branches: [ master, develop, release]
  pull_request:
    branches: [ master, develop, release]

jobs:
  win_unit_test:
    runs-on: windows-2016
    defaults:
      run:
        shell: cmd
        working-directory: ci-tools/windows

    env:
      PROJECT: epanet
      BUILD_HOME: build

    steps:
    - name: Checkout epanet-solver repo
      uses: actions/checkout@v2

    - name: Checkout ci-tools repo
      uses: actions/checkout@v2
      with:
        repository: michaeltryby/ci-tools
        ref: master
        path: ci-tools

    - name: Cache system deps
      uses: actions/cache@v2
      env:
        cache-name: cache-sys-deps
        cache-path: |
          C:/ProgramData/chocolatey/lib/boost-*
          C:/local/boost_*
      with:
        path: |
          C:/ProgramData/chocolatey/lib/boost-*
          C:/local/boost_*
        key: windows-build-${{ env.cache-name }}-${{ hashFiles('packages.config') }}
        restore-keys: |
          windows-build-${{ env.cache-name }}-
          windows-build-
          windows-

    - name: Install system deps
      run:  choco install packages.config -y

    - name: Build and unit test
      run: make.cmd /t


